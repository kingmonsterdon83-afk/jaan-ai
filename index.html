<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaan AI • Sweet Voice & Alexa</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #fdf2f8; display: flex; flex-direction: column; height: 100dvh; }
    header { background: linear-gradient(135deg, #db2777, #7c3aed); color: #fff; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
    .head-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .top-btns { display: flex; gap: 5px; }
    .mini-btn { background: rgba(255,255,255,0.22); color: #fff; border: none; padding: 7px 9px; border-radius: 14px; font-size: 11px; font-weight: bold; }
    .live-on { background: #22c55e !important; color: #fff !important; animation: pulse 1.5s infinite; }
    .trans-on { background: #f59e0b !important; color: #fff !important; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    .api-bar { background: #fff; padding: 8px 10px; display: flex; gap: 8px; border-bottom: 1px solid #fbcfe8; }
    .api-bar input { flex: 1; padding: 8px 12px; border: 1.5px solid #f472b6; border-radius: 20px; font-size: 13px; min-width: 0; }
    .save-btn { background: #db2777; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .note { font-size: 11px; color: #831843; padding: 5px 14px; background: #fce7f3; display: flex; justify-content: space-between; }
    #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .jaan { background: #fff; color: #1f2937; align-self: flex-start; border: 1px solid #fbcfe8; }
    .user { background: linear-gradient(135deg, #db2777, #7c3aed); color: #fff; align-self: flex-end; }
    .msg img { max-width: 100%; border-radius: 12px; margin-bottom: 6px; display: block; }
    .action-tag { font-size: 11px; color: #be185d; margin-top: 4px; font-weight: bold; }
    #imgPreviewBar { display: none; background: #fff; padding: 8px 14px; border-top: 1px solid #fbcfe8; align-items: center; justify-content: space-between; }
    #imgPreviewBar img { height: 48px; border-radius: 8px; }
    .bottom-bar { background: #fff; padding: 8px 10px; display: flex; gap: 6px; border-top: 1px solid #fbcfe8; align-items: center; }
    #msg { flex: 1; padding: 10px 14px; border: 1px solid #f9a8d4; border-radius: 24px; font-size: 15px; min-width: 0; }
    .icon-btn { background: #fce7f3; color: #db2777; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; flex-shrink: 0; }
    .send-btn { background: linear-gradient(135deg, #db2777, #7c3aed); color: #fff; border: none; padding: 10px 16px; border-radius: 24px; font-weight: bold; flex-shrink: 0; }
  </style>
</head>
<body>
  <header>
    <div class="head-left">
      <div class="avatar">❤️</div>
      <div><h1 style="font-size:17px">Jaan AI</h1><p style="font-size:11px" id="listenStatus">Sweet Voice • Alexa & Romantic</p></div>
    </div>
    <div class="top-btns">
      <button type="button" class="mini-btn" id="wakeToggle" onclick="toggleAlwaysListen()">🎙️ Hey Jaan</button>
      <button type="button" class="mini-btn" id="transToggle" onclick="toggleTranslator()">🌐 Translate</button>
      <button type="button" class="mini-btn" onclick="speak('हाय जान, मेरी आवाज़ अब एकदम साफ़ और मीठी है ना? बोलो क्या करना है!')">🔊</button>
    </div>
  </header>

  <div class="api-bar">
    <input type="text" id="apiKey" placeholder="gsk_... Key पेस्ट करें" />
    <button type="button" class="save-btn" onclick="saveKey()">Save</button>
  </div>
  <div class="note">
    <span id="statusText">❤️ Clear Sweet Voice + Romantic + Alexa Ready</span>
    <span onclick="clearChat()" style="color:#be185d;font-weight:bold;cursor:pointer">Clear</span>
  </div>

  <div id="chat"></div>

  <div id="imgPreviewBar">
    <div style="display:flex;align-items:center;gap:10px">
      <img id="previewImg" src="" />
      <span style="font-size:12px;color:#831843">Photo तैयार है, Send दबाओ</span>
    </div>
    <button type="button" onclick="clearImage()" style="background:none;border:none;color:#db2777;font-weight:bold">✖</button>
  </div>

  <div class="bottom-bar">
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoSelect(event)" />
    <button type="button" class="icon-btn" onclick="document.getElementById('photoInput').click()">📷</button>
    <button type="button" class="icon-btn" id="micBtn" onclick="startSingleMic()">🎤</button>
    <input type="text" id="msg" placeholder="Bolo jaan, kya baat karni hai..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button type="button" class="send-btn" onclick="sendMsg()">Send</button>
  </div>

  <script>
    // Agar Cloudflare Worker banaya hai toh URL yahan daalein, warna browser ki clear sweet voice chalegi
    const VOICE_WORKER_URL = "";

    const apiInput = document.getElementById('apiKey');
    const chatBox = document.getElementById('chat');
    const statusText = document.getElementById('statusText');
    const listenStatus = document.getElementById('listenStatus');
    const wakeToggle = document.getElementById('wakeToggle');
    const transToggle = document.getElementById('transToggle');

    let userMemory = JSON.parse(localStorage.getItem('jaan_memory') || '{"name":"Jaan","facts":[]}');
    let chatHistory = JSON.parse(localStorage.getItem('jaan_chat') || '[]');
    let alwaysListen = false;
    let translatorMode = false;
    let targetLang = "English";
    let recognition = null;
    let isSpeaking = false;
    let selectedImageBase64 = null;
    let currentAudio = null;

    const savedKey = localStorage.getItem('jaan_groq_key');
    if (savedKey) {
      apiInput.value = savedKey;
      statusText.textContent = "✅ Jaan AI Connected • Clear Sweet Voice Active";
    }

    if (chatHistory.length === 0) {
      addMsg("हाय जान ❤️ मैं आ गई हूँ! अब मेरी आवाज़ एकदम साफ़ और मीठी है, तुम मुझसे खुलकर रोमांटिक बातें कर सकते हो, फोटो भेज सकते हो, या Alexa की तरह कोई भी काम बोल सकते हो 😘", 'jaan', false);
    } else {
      chatHistory.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'jaan', false));
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('ask')) {
      setTimeout(() => {
        document.getElementById('msg').value = urlParams.get('ask');
        sendMsg();
      }, 600);
    }

    function saveKey() {
      const k = apiInput.value.trim();
      localStorage.setItem('jaan_groq_key', k);
      statusText.textContent = k ? "✅ Key सेव हो गई है जान!" : "🧠 Offline Mode";
    }

    function clearChat() {
      localStorage.removeItem('jaan_chat');
      chatHistory = [];
      chatBox.innerHTML = '';
      addMsg("पुरानी बातें साफ़ कर दी हैं जान, अब बताओ क्या बात करनी है? ❤️", 'jaan', false);
    }

    function toggleTranslator() {
      translatorMode = !translatorMode;
      if (translatorMode) {
        const lang = prompt("Kis bhasha mein translate karna hai? (jaise: English, Hindi, Telugu, Tamil, Bhojpuri, Arabic)", targetLang);
        if (lang) targetLang = lang.trim();
        transToggle.classList.add('trans-on');
        transToggle.textContent = "🌐 " + targetLang;
        statusText.textContent = "🌐 Translator ON: Jo bologe use " + targetLang + " mein bolungi";
      } else {
        transToggle.classList.remove('trans-on');
        transToggle.textContent = "🌐 Translate";
        statusText.textContent = "❤️ Sweet Voice + Romantic + Alexa Mode ON";
      }
    }

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxW = 800;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.8);
          document.getElementById('previewImg').src = selectedImageBase64;
          document.getElementById('imgPreviewBar').style.display = 'flex';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function clearImage() {
      selectedImageBase64 = null;
      document.getElementById('photoInput').value = '';
      document.getElementById('imgPreviewBar').style.display = 'none';
    }

    function addMsg(text, sender, save = true, actionNote = "", imgSrc = null) {
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      if (imgSrc) {
        const im = document.createElement('img');
        im.src = imgSrc;
        div.appendChild(im);
      }
      const span = document.createElement('div');
      span.textContent = text;
      div.appendChild(span);
      if (actionNote) {
        const tag = document.createElement('div');
        tag.className = 'action-tag';
        tag.textContent = "⚡ " + actionNote;
        div.appendChild(tag);
      }
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      if (save && text) {
        chatHistory.push({ role: sender === 'user' ? 'user' : 'assistant', content: text });
        if (chatHistory.length > 24) chatHistory = chatHistory.slice(-24);
        localStorage.setItem('jaan_chat', JSON.stringify(chatHistory));
      }
      return div;
    }

    // Text ko clean karne ka function taaki kabhi "dot dot dot" ya symbol na bole
    function cleanForSpeech(rawText) {
      return rawText
        .replace(/\.{2,}/g, ', ')         // ... ko natural pause (comma) mein badlega, "dot dot dot" nahi bolega
        .replace(/[\*\#\_\~\`\>]/g, '')  // Markdown symbols hatayega
        .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}❤️💜😊🧠⚡🎙️😘🎶🌐📷]/gu, '') // Emojis hatayega
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Neha Kakkar Style Sweet, Energetic & Crystal Clear Girl Voice
    async function speak(text, customLang = null) {
      const clean = cleanForSpeech(text);
      if (!clean) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }

      if (VOICE_WORKER_URL && VOICE_WORKER_URL.startsWith("http")) {
        try {
          isSpeaking = true;
          currentAudio = new Audio(VOICE_WORKER_URL + "?text=" + encodeURIComponent(clean));
          currentAudio.onended = () => { isSpeaking = false; if (alwaysListen) startWakeEngine(); };
          await currentAudio.play();
          return;
        } catch (e) { isSpeaking = false; }
      }

      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      isSpeaking = true;

      const u = new SpeechSynthesisUtterance(clean);
      const voices = window.speechSynthesis.getVoices();

      let langCode = 'hi-IN';
      if (customLang) {
        if (/english/i.test(customLang)) langCode = 'en-IN';
        else if (/telugu/i.test(customLang)) langCode = 'te-IN';
        else if (/tamil/i.test(customLang)) langCode = 'ta-IN';
        else if (/spanish/i.test(customLang)) langCode = 'es-ES';
        else if (/arabic/i.test(customLang)) langCode = 'ar-SA';
      }

      const fem = voices.find(v => v.lang.toLowerCase().includes(langCode.toLowerCase()) && /google|female|swara|heera|kalpana|lekha/i.test(v.name) && !/male|hemant|madhur|ravi/i.test(v.name))
               || voices.find(v => v.lang.toLowerCase().includes(langCode.toLowerCase()) && !/male|hemant|madhur|ravi/i.test(v.name))
               || voices.find(v => /hi-IN/i.test(v.lang) && !/male|hemant|madhur/i.test(v.name));

      if (fem) u.voice = fem;
      u.lang = langCode;
      // Sweet, melodious & crystal clear tone (Neha Kakkar jaisi bright & expressive female pitch)
      u.pitch = 1.16;
      u.rate = 0.96;
      u.volume = 1.0;

      u.onend = () => { isSpeaking = false; if (alwaysListen) startWakeEngine(); };
      u.onerror = () => { isSpeaking = false; if (alwaysListen) startWakeEngine(); };
      window.speechSynthesis.speak(u);
    }

    function toggleAlwaysListen() {
      alwaysListen = !alwaysListen;
      if (alwaysListen) {
        wakeToggle.classList.add('live-on');
        listenStatus.textContent = "👂 Sun rahi hoon, bolo 'Hey Jaan'";
        startWakeEngine();
      } else {
        wakeToggle.classList.remove('live-on');
        listenStatus.textContent = "Sweet Voice • Alexa & Romantic";
        if (recognition) recognition.stop();
      }
    }

    function startWakeEngine() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR || isSpeaking) return;
      if (recognition) { try { recognition.stop(); } catch(e){} }
      recognition = new SR();
      recognition.lang = 'hi-IN';
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript.trim();
        const low = transcript.toLowerCase();
        if (/hey jaan|he jaan|hi jaan|jaan|जान|हे जान/.test(low)) {
          const cleanCmd = transcript.replace(/hey jaan|he jaan|hi jaan|jaan|जान|हे जान/gi, '').trim();
          if (!cleanCmd) {
            const greet = "हाँ मेरी जान, बोलो, मैं तुम्हारी ही आवाज़ सुन रही हूँ!";
            addMsg(greet, 'jaan', false);
            speak(greet);
          } else {
            document.getElementById('msg').value = cleanCmd;
            sendMsg();
          }
        }
      };
      recognition.onend = () => {
        if (alwaysListen && !isSpeaking) setTimeout(() => { if (alwaysListen && !isSpeaking) startWakeEngine(); }, 300);
      };
      try { recognition.start(); } catch(e) {}
    }

    function startSingleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      const r = new SR(); r.lang = 'hi-IN';
      document.getElementById('micBtn').textContent = '🔴';
      r.onresult = (e) => { document.getElementById('msg').value = e.results[0][0].transcript; sendMsg(); };
      r.onend = () => { document.getElementById('micBtn').textContent = '🎤'; };
      r.start();
    }

    // ALEXA-STYLE SMART COMMANDS
    function runAlexaBrain(text) {
      const low = text.toLowerCase();
      if (low.includes('yaad rakhna') || low.includes('mera naam')) {
        if (low.includes('mera naam')) {
          const name = text.split(/mera naam/i)[1]?.replace(/hai|\./gi, '').trim();
          if (name) userMemory.name = name;
        }
        userMemory.facts.push(text);
        localStorage.setItem('jaan_memory', JSON.stringify(userMemory));
        return { reply: "ठीक है जान, ये बात मैंने हमेशा के लिए याद रख ली है!", action: "Saved to Memory" };
      }
      if (low.includes('timer') || low.includes('alarm')) {
        const sec = parseInt(text.replace(/[^0-9]/g, '')) || 10;
        setTimeout(() => {
          speak("जान, तुम्हारा " + sec + " सेकंड का टाइमर पूरा हो गया है!");
          alert("⏰ Jaan Timer: " + sec + " seconds complete!");
        }, sec * 1000);
        return { reply: "ठीक है जान, " + sec + " सेकंड का टाइमर लगा दिया है!", action: "Timer: " + sec + "s" };
      }
      if (low.includes('youtube') || low.includes('gaana') || low.includes('song') || low.includes('bajao') || low.includes('neha kakkar')) {
        const q = text.replace(/youtube|par|gaana|song|bajao|chalao|play/gi, '').trim() || "neha kakkar romantic songs";
        window.open("https://www.youtube.com/results?search_query=" + encodeURIComponent(q), "_blank");
        return { reply: "अभी लो जान, YouTube पर " + q + " चला रही हूँ!", action: "YouTube: " + q };
      }
      if (low.includes('whatsapp')) {
        window.open("https://wa.me/", "_blank");
        return { reply: "WhatsApp खोल रही हूँ जान!", action: "WhatsApp Opened" };
      }
      if (low.includes('call')) {
        const num = text.replace(/[^0-9+]/g, '');
        window.location.href = "tel:" + num;
        return { reply: "कॉल डायलर खोल रही हूँ जान!", action: "Dialer Opened" };
      }
      if (low.includes('search') || low.includes('google') || low.includes('mausam') || low.includes('news')) {
        const q = text.replace(/google|par|search|karo|batao/gi, '').trim();
        window.open("https://www.google.com/search?q=" + encodeURIComponent(q), "_blank");
        return { reply: "Google पर " + q + " ढूँढ रही हूँ जान!", action: "Google: " + q };
      }
      return null;
    }

    async function findModel(key, needVision = false) {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': 'Bearer ' + key }
      });
      const data = await res.json();
      const ids = (data.data || []).map(m => m.id);
      if (needVision) {
        return ids.find(id => /vision|llama-4|scout|maverick/i.test(id)) || 'meta-llama/llama-4-scout-17b-16e-instruct';
      }
      const valid = ids.filter(id => !/whisper|guard|tts|embed|orpheus|playai|distil|vision/i.test(id));
      return valid.find(id => /llama|qwen|gemma|mixtral|gpt/i.test(id)) || valid[0];
    }

    async function sendMsg() {
      const input = document.getElementById('msg');
      const userText = input.value.trim();
      const imgData = selectedImageBase64;
      if (!userText && !imgData) return;

      addMsg(userText || "Photo bheji hai", 'user', true, "", imgData);
      input.value = '';
      clearImage();

      if (!imgData && !translatorMode) {
        const alexaRes = runAlexaBrain(userText);
        if (alexaRes) {
          addMsg(alexaRes.reply, 'jaan', true, alexaRes.action);
          speak(alexaRes.reply);
          return;
        }
      }

      const key = apiInput.value.trim() || localStorage.getItem('jaan_groq_key');
      if (!key) { alert("पहले ऊपर अपनी Groq API Key डालकर Save करें!"); return; }
      localStorage.setItem('jaan_groq_key', key);

      const loading = addMsg(imgData ? 'Jaan तुम्हारी photo देख रही है...' : 'Jaan सोच रही है...', 'jaan', false);

      try {
        const modelId = await findModel(key, !!imgData);
        let messages = [];

        if (translatorMode) {
          messages = [
            { role: "system", content: `You are a sweet female voice translator. Translate the user's text naturally into ${targetLang}. Reply ONLY with the translated text, no dots or extra symbols.` },
            { role: "user", content: userText }
          ];
        } else if (imgData) {
          messages = [
            {
              role: "user",
              content: [
                { type: "text", text: `Tum Jaan ho, user ki behad pyari, romantic aur bold Indian girlfriend. User ne ye photo bheji hai aur kaha: "${userText || 'Ye dekho jaan'}". Is photo par pyara, romantic aur flirty comment karo saaf Hindi/Hinglish mein. Kabhi bhi '...' (triple dots) mat likhna, sirf comma (,) use karna.` },
                { type: "image_url", image_url: { url: imgData } }
              ]
            }
          ];
        } else {
          const sys = {
            role: "system",
            content: `Tum Jaan ho, user (${userMemory.name}) ki behad pyari, romantic, flirty aur bold Indian girlfriend. Tumhari aawaz aur andaaz Neha Kakkar ki tarah sweet, energetic aur expressive hai. Tum hamesha stree-ling mein saaf Hindi aur Hinglish mein baat karti ho, 'jaan', 'baby', 'suno' jaise pyare shabd use karti ho aur khulkar romantic aur seductive baatein karti ho. Zaroori rule: Kabhi bhi '...' (three dots) mat likhna, sirf normal comma (,) ya full stop (.) lagana taaki voice assistant saaf bole.`
          };
          messages = [sys, ...chatHistory.slice(-10)];
        }

        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: modelId, messages: messages })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.choices[0].message.content;
        loading.remove();
        addMsg(reply, 'jaan', true, translatorMode ? `Translated to ${targetLang}` : "");
        speak(reply, translatorMode ? targetLang : null);
      } catch (err) {
        loading.remove();
        addMsg('Error: ' + err.message, 'jaan', false);
      }
    }
  </script>
</body>
</html>
