<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaan AI • Live Creative Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    /* 1. ANIMATED LIVE BACKGROUND */
    body {
      background: radial-gradient(circle at top, #14010a 0%, #030002 80%, #000000 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }
    
    /* Live backdrop wave/stars animation overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fbcfe8, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #f472b6, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 80px 120px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 110px 220px, #f43f5e, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 140px 180px, #fff, rgba(0,0,0,0));
      background-size: 250px 250px;
      opacity: 0.45;
      animation: liveBackgroundMove 90s linear infinite;
      z-index: 1;
      pointer-events: none;
    }

    @keyframes liveBackgroundMove {
      from { background-position: 0 0; }
      to { background-position: 1000px 1000px; }
    }

    /* Shimmering colored neon particles */
    .glowing-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244,63,94,0.7) 0%, rgba(225,29,72,0) 70%);
      animation: pulseAndFloat 8s infinite ease-in-out;
      opacity: 0.5;
    }

    @keyframes pulseAndFloat {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    header {
      background: linear-gradient(135deg, rgba(219, 39, 119, 0.75), rgba(124, 58, 237, 0.75));
      backdrop-filter: blur(15px);
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(244, 63, 94, 0.35);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(225, 29, 72, 0.15);
    }
    
    .head-left { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #fb7185, #e11d48);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #fff;
    }
    
    .top-btns { display: flex; gap: 6px; }
    .mini-btn {
      background: rgba(255, 255, 255, 0.15); color: #ffe4e6;
      border: 1px solid rgba(251, 113, 133, 0.45);
      padding: 7px 10px; border-radius: 16px; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    
    .live-on { background: #e11d48 !important; color: #fff !important; box-shadow: 0 0 14px #f43f5e; }
    
    .api-bar {
      background: rgba(24, 5, 16, 0.85); backdrop-filter: blur(8px);
      padding: 8px 10px; display: flex; gap: 8px;
      border-bottom: 1px solid rgba(244, 63, 94, 0.25);
      z-index: 10;
    }
    
    .api-bar input {
      flex: 1; padding: 8px 12px; background: rgba(255, 255, 255, 0.08); color: #fff;
      border: 1px solid rgba(244, 63, 94, 0.5); border-radius: 20px; font-size: 13px; min-width: 0; outline: none;
    }
    
    .save-btn {
      background: linear-gradient(135deg, #e11d48, #9333ea); color: #fff;
      border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px;
    }
    
    .live-banner {
      font-size: 11px; color: #fda4af; padding: 6px 14px;
      background: rgba(136, 19, 55, 0.35); display: flex; justify-content: space-between;
      z-index: 10;
    }
    
    #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 11px; z-index: 5; }
    
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.45; word-wrap: break-word; }
    
    .jaan { 
      background: rgba(45, 10, 30, 0.75); 
      backdrop-filter: blur(10px);
      color: #ffe4e6; align-self: flex-start; 
      border: 1px solid rgba(244, 63, 94, 0.35); 
    }
    
    .user { background: linear-gradient(135deg, rgba(225,29,72,0.85), rgba(126,34,206,0.85)); color: #fff; align-self: flex-end; }
    
    .msg img { max-width: 100%; border-radius: 12px; margin-bottom: 6px; display: block; }
    .action-tag { font-size: 11px; color: #fb7185; margin-top: 5px; font-weight: 700; }
    
    .song-card, .image-card {
      margin-top: 8px; padding: 10px; background: rgba(225, 29, 72, 0.25);
      border: 1px solid #fb7185; border-radius: 12px; display: flex; flex-direction: column; gap: 6px;
    }
    
    .song-btn, .dl-btn {
      background: #e11d48; color: #fff; text-align: center; padding: 8px;
      border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; cursor: pointer;
    }
    .dl-btn { background: #7e22ce; }
    
    .bottom-bar {
      background: rgba(18, 4, 12, 0.95); padding: 9px 10px; display: flex; gap: 7px;
      border-top: 1px solid rgba(244, 63, 94, 0.35); align-items: center;
      z-index: 10;
    }
    
    #msg {
      flex: 1; padding: 11px 15px; background: rgba(255, 255, 255, 0.09); color: #fff;
      border: 1px solid rgba(244, 63, 94, 0.45); border-radius: 24px; font-size: 15px; min-width: 0; outline: none;
    }
    
    .icon-btn {
      background: rgba(244, 63, 94, 0.2); color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.4); width: 42px; height: 42px;
      border-radius: 50%; font-size: 14px; flex-shrink: 0; cursor: pointer;
    }
    
    .send-btn {
      background: linear-gradient(135deg, #f43f5e, #9333ea); color: #fff;
      border: none; padding: 11px 18px; border-radius: 24px; font-weight: 700; flex-shrink: 0; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Particle container for smooth background motion -->
  <div class="glowing-bg" id="particleContainer"></div>

  <header>
    <div class="head-left">
      <div class="avatar">J</div>
      <div>
        <h1 style="font-size:17px;">Jaan AI</h1>
        <p style="font-size:11px;color:#fecdd3;" id="listenStatus">Safe Creativity • 24/7 Ready</p>
      </div>
    </div>
    <div class="top-btns">
      <button type="button" class="mini-btn" id="wakeToggle" onclick="toggleAlwaysListen()">Live: OFF</button>
      <button type="button" class="mini-btn" onclick="speak('हाय जान, देखो मैंने बैकग्राउंड को बिल्कुल लाइव बना दिया है। सब कितना सुंदर लग रहा है ना? बोलो क्या काम है?')">Test</button>
    </div>
  </header>

  <div class="api-bar">
    <input type="text" id="apiKey" placeholder="gsk_... Key पेस्ट करें" />
    <button type="button" class="save-btn" onclick="saveKey()">Save</button>
  </div>
  <div class="live-banner">
    <span id="liveHeardText">Live bg active! Bolo: Hey Jaan, ek romantic wallpaper banao</span>
    <span onclick="clearChat()" style="color:#fb7185;font-weight:bold;cursor:pointer">Clear</span>
  </div>

  <div id="chat"></div>

  <div class="bottom-bar">
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoSelect(event)" />
    <button type="button" class="icon-btn" onclick="document.getElementById('photoInput').click()">Cam</button>
    <button type="button" class="icon-btn" id="micBtn" onclick="startSingleMic()">Mic</button>
    <input type="text" id="msg" placeholder="Bolo Hey Jaan ya photo banao..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button type="button" class="send-btn" onclick="sendMsg()">Send</button>
  </div>

  <script>
    // Create random moving background particles for rich, animated visual
    const container = document.getElementById('particleContainer');
    function createBgParticles() {
      for (let i = 0; i < 15; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 80 + 30;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = (Math.random() * 8) + 's';
        p.style.animationDuration = (Math.random() * 5 + 6) + 's';
        container.appendChild(p);
      }
    }
    createBgParticles();

    const apiInput = document.getElementById('apiKey');
    const chatBox = document.getElementById('chat');
    const liveHeardText = document.getElementById('liveHeardText');
    const listenStatus = document.getElementById('listenStatus');
    const wakeToggle = document.getElementById('wakeToggle');

    let userMemory = JSON.parse(localStorage.getItem('jaan_memory') || '{"name":"Jaan","facts":[]}');
    let chatHistory = JSON.parse(localStorage.
