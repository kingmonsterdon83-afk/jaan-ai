<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jaan AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #f8f5ff; display: flex; flex-direction: column; height: 100dvh; }
    header { background: linear-gradient(135deg, #6366f1, #ec4899); color: #fff; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
    .head-left { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .voice-btn { background: rgba(255,255,255,0.25); color: #fff; border: none; padding: 8px 12px; border-radius: 16px; font-size: 13px; font-weight: bold; }
    .api-bar { background: #fff; padding: 10px; display: flex; gap: 8px; border-bottom: 1px solid #e5e7eb; }
    .api-bar input { flex: 1; padding: 10px; border: 1.5px solid #c4b5fd; border-radius: 20px; font-size: 14px; min-width: 0; }
    .save-btn { background: #7c3aed; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; }
    .note { font-size: 12px; color: #4b5563; padding: 6px 14px; background: #f3e8ff; }
    #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 11px 15px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .jaan { background: #ede9fe; color: #1f2937; align-self: flex-start; }
    .user { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; align-self: flex-end; }
    .bottom-bar { background: #fff; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #e5e7eb; }
    #msg { flex: 1; padding: 11px 15px; border: 1px solid #d1d5db; border-radius: 24px; font-size: 15px; min-width: 0; }
    .icon-btn { background: #f3e8ff; color: #7c3aed; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 18px; }
    .send-btn { background: linear-gradient(135deg, #7c3aed, #db2777); color: #fff; border: none; padding: 11px 18px; border-radius: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div class="head-left">
      <div class="avatar">💜</div>
      <div><h1 style="font-size:18px">Jaan AI</h1><p style="font-size:12px">तुम्हारी AI साथी • हमेशा बातचीत के लिए</p></div>
    </div>
    <button type="button" class="voice-btn" onclick="speak('हाय, मैं जान हूँ। मेरी आवाज़ कैसी लग रही है?')">🔊 Test Voice</button>
  </header>

  <div class="api-bar">
    <input type="text" id="apiKey" placeholder="यहाँ gsk_... वाली Key पेस्ट करें" />
    <button type="button" class="save-btn" onclick="saveKey()">Save</button>
  </div>
  <div class="note" id="statusText">Step 1: ऊपर gsk_... key पेस्ट करें -> Step 2: Save दबाएं</div>

  <div id="chat">
    <div class="msg jaan">हाय ❤️ मैं Jaan हूँ। आज तुम क्या बात करना चाहते हो?</div>
  </div>

  <div class="bottom-bar">
    <button type="button" class="icon-btn" id="micBtn" onclick="startMic()">🎤</button>
    <input type="text" id="msg" placeholder="Jaan से बात करो..." onkeydown="if(event.key==='Enter') sendMsg()" />
    <button type="button" class="send-btn" onclick="sendMsg()">Send</button>
  </div>

  <script>
    const apiInput = document.getElementById('apiKey');
    const chatBox = document.getElementById('chat');
    const statusText = document.getElementById('statusText');
    let selectedVoice = null;
    let history = [{ role: "system", content: "Tum Jaan ho, ek pyari Indian ladki (female AI assistant). Tum hamesha stree-ling (female gender, jaise 'main khush hoon', 'main kar rahi hoon') mein natural Hindi aur Hinglish mein chhote, pyare jawab deti ho. Kabhi JSON ya code mat likhna." }];

    function loadFemaleVoice() {
      const voices = window.speechSynthesis.getVoices();
      selectedVoice =
        voices.find(v => /hi-IN/i.test(v.lang) && /female|swara|heera|kalpana|lekha|google हिन्दी/i.test(v.name)) ||
        voices.find(v => /hi-IN/i.test(v.lang) && !/male|hemant|madhur/i.test(v.name)) ||
        voices.find(v => /en-IN/i.test(v.lang) && /female|neerja|veena|raveena/i.test(v.name)) ||
        voices.find(v => /hi/i.test(v.lang));
    }
    window.speechSynthesis.onvoiceschanged = loadFemaleVoice;
    loadFemaleVoice();

    const saved = localStorage.getItem('jaan_groq_key');
    if (saved) {
      apiInput.value = saved;
      statusText.textContent = "✅ Key सेव है! नीचे से बात शुरू करें।";
      statusText.style.background = "#dcfce7";
    }

    function saveKey() {
      const k = apiInput.value.trim();
      if (!k) { alert("पहले ऊपर gsk_... वाली Key पेस्ट करें!"); return; }
      localStorage.setItem('jaan_groq_key', k);
      statusText.textContent = "✅ Key सेव हो गई है!";
      statusText.style.background = "#dcfce7";
    }

    function addMsg(text, sender) {
      const div = document.createElement('div');
      div.className = 'msg ' + sender;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      loadFemaleVoice();
      window.speechSynthesis.cancel();
      const clean = text.replace(/[\u{1F600}-\u{1F6FF}❤️💜😊]/gu, '');
      const u = new SpeechSynthesisUtterance(clean);
      if (selectedVoice) u.voice = selectedVoice;
      u.lang = 'hi-IN';
      u.pitch = 1.18;
      u.rate = 0.98;
      window.speechSynthesis.speak(u);
    }

    function startMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert("वॉइस सपोर्ट नहीं है।"); return; }
      const r = new SR(); r.lang = 'hi-IN';
      document.getElementById('micBtn').textContent = '🔴';
      r.onresult = (e) => { document.getElementById('msg').value = e.results[0][0].transcript; sendMsg(); };
      r.onend = () => { document.getElementById('micBtn').textContent = '🎤'; };
      r.start();
    }

    async function findWorkingModel(key) {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': 'Bearer ' + key }
      });
      const data = await res.json();
      const valid = (data.data || [])
        .map(m => m.id)
        .filter(id => !/whisper|guard|tts|embed|orpheus|playai|distil/i.test(id));
      return valid.find(id => /llama|qwen|gemma|mixtral|deepseek|gpt/i.test(id)) || valid[0];
    }

    async function sendMsg() {
      const key = apiInput.value.trim() || localStorage.getItem('jaan_groq_key');
      if (!key) { alert("पहले ऊपर अपनी Groq API Key डालकर Save करें!"); return; }
      localStorage.setItem('jaan_groq_key', key);

      const input = document.getElementById('msg');
      const userText = input.value.trim();
      if (!userText) return;

      addMsg(userText, 'user');
      input.value = '';
      history.push({ role: "user", content: userText });
      const loading = addMsg('Jaan सोच रही है...', 'jaan');

      try {
        const modelId = await findWorkingModel(key);
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
          body: JSON.stringify({ model: modelId, messages: history })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const reply = data.choices[0].message.content;
        loading.textContent = reply;
        history.push({ role: "assistant", content: reply });
        speak(reply);
      } catch (err) {
        loading.textContent = '❌ Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
