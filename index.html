<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jaan AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f5fb;color:#252235;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 28px #25113b12}.header{padding:18px 20px;background:linear-gradient(135deg,#7c3aed,#d946a8);color:#fff;display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;background:#ffffff30;display:grid;place-items:center;font-size:25px}.header h1{font-size:20px;margin:0}.header small{opacity:.9}.settings{padding:10px 14px;background:#faf7ff;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.settings input{min-width:0;flex:1;padding:9px;border:1px solid #ddd;border-radius:10px;font-size:13px}.settings button{border:0;background:#eee5ff;border-radius:9px;padding:9px 11px;color:#5928a4;font-weight:600}.note{font-size:11px;color:#777;width:100%}.chat{flex:1;padding:16px;overflow:auto;min-height:55vh;display:flex;flex-direction:column;gap:12px}.bubble{padding:12px 15px;border-radius:18px;max-width:88%;white-space:pre-wrap;line-height:1.45}.ai{align-self:flex-start;background:#f2ecfb;border-bottom-left-radius:5px}.user{align-self:flex-end;background:#7c3aed;color:white;border-bottom-right-radius:5px}.status{font-size:12px;color:#888;padding:0 16px}.compose{padding:12px;border-top:1px solid #eee;display:flex;gap:8px;background:#fff}.compose textarea{resize:none;flex:1;min-height:45px;max-height:130px;border:1px solid #ddd;border-radius:14px;padding:12px;font:inherit;outline-color:#a78bfa}.compose button{border:0;border-radius:14px;background:#7c3aed;color:#fff;padding:0 17px;font-weight:700}.compose button:disabled{opacity:.55}.footer{font-size:11px;text-align:center;color:#aaa;padding:6px 10px 12px}
</style></head><body><main class="app"><header class="header"><div class="avatar">💜</div><div><h1>Jaan AI</h1><small>तुम्हारी AI साथी · हमेशा बातचीत के लिए</small></div></header>
<section class="settings"><input id="api" placeholder="Backend URL (उदा. https://your-api.example.com)" aria-label="Backend URL"><button id="save">Save</button><div class="note">Chat शुरू करने से पहले अपने hosted backend का URL डालें। OpenAI API key इस वेबसाइट में न डालें।</div></section>
<section class="chat" id="chat"><div class="bubble ai">हाय ❤️ मैं Jaan हूँ। आज तुम क्या बात करना चाहते हो?</div></section><div class="status" id="status"></div>
<form class="compose" id="form"><textarea id="msg" placeholder="Jaan से बात करो…" rows="1"></textarea><button id="send" type="submit">Send</button></form><div class="footer">Jaan AI · AI companion</div></main>
<script>
const chat=document.getElementById('chat'),api=document.getElementById('api'),msg=document.getElementById('msg'),status=document.getElementById('status'),send=document.getElementById('send');let history=[];
api.value=localStorage.getItem('jaan_api_url')||'';document.getElementById('save').onclick=()=>{localStorage.setItem('jaan_api_url',api.value.trim().replace(/\/$/,''));status.textContent='Backend URL saved on this device.'};
function add(text,who){let b=document.createElement('div');b.className='bubble '+who;b.textContent=text;chat.appendChild(b);chat.scrollTop=chat.scrollHeight}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();let text=msg.value.trim();if(!text)return;let base=(api.value||localStorage.getItem('jaan_api_url')||'').trim().replace(/\/$/,'');if(!base){status.textContent='पहले ऊपर Backend URL डालकर Save करें।';return}add(text,'user');msg.value='';send.disabled=true;status.textContent='Jaan जवाब लिख रही है…';try{let r=await fetch(base+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history})});let data=await r.json();if(!r.ok)throw new Error(data.detail||'Request failed');add(data.reply||'जवाब नहीं मिला।','ai');history.push({role:'user',content:text},{role:'assistant',content:data.reply});history=history.slice(-24);status.textContent=''}catch(err){status.textContent='कनेक्शन नहीं हुआ: '+err.message+' (Backend URL और server जाँचें)'}finally{send.disabled=false;msg.focus()}});
msg.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}});
</script></body></html>
